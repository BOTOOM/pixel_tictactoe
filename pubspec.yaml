name: pixel_tictactoe
description: Pixel-art tic-tac-toe with an over-the-top win animation.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.5.0

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
